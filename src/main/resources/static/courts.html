<!DOCTYPE html>
<html lang="vi">
<head>
<script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh Sách Sân — AU Badminton</title>
  <link href="assets/css/bootstrap.min.css?v=2.8.0" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/fontawesome.min.css?v=2.8.0" />
  <link rel="stylesheet" href="assets/css/style.css?v=2.8.0" />
  <style>
    body { background: var(--gray-50); }
    .court-card { background: white; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); overflow: hidden; transition: var(--transition); height: 100%; display: flex; flex-direction: column; }
    .court-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-4px); }
    .court-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--gray-100); }
    .court-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .court-title { font-size: 1.1rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.25rem; }
    .court-price { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; }
  </style>
<script>

function escHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}
</script>
<script>document.documentElement.dataset.theme = localStorage.getItem("au_theme") === "dark" ? "dark" : "light";</script>
</head>
<body>
  <nav class="au-navbar navbar navbar-expand-lg">
    <div class="container">
      <a href="index.html" class="au-logo">
        <div class="au-logo-icon">🏸</div>
        <div>
          <div class="au-logo-text">AU Badminton</div>
          <div class="au-logo-sub">SÂN CẦU LÔNG — UY TÍN #1</div>
        </div>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="d-flex align-items-center gap-3 mx-auto mt-2 mt-lg-0">
          <a href="index.html" class="au-nav-link">Trang Chủ</a>
          <a href="courts.html" class="au-nav-link active">Danh Sách Sân</a>
          <a href="booking-history.html" class="au-nav-link">Lịch Đặt Sân</a>
        </div>
        <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0">
          <a href="login.html" class="au-avatar" style="text-decoration:none;" title="Tài khoản">K</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <div class="text-center mb-4">
      <h2 style="font-weight: 800; color: var(--gray-900);">Danh Sách Sân Cầu Lông</h2>
      <p style="color: var(--gray-500);">Lựa chọn sân phù hợp và trải nghiệm dịch vụ đẳng cấp</p>
    </div>

    <div class="au-card mb-4" style="padding: 1.5rem; background: linear-gradient(135deg, #EFF6FF, #DBEAFE); border: 1px solid #BFDBFE;">
      <h5 style="color: #1E3A8A; font-weight: 800; margin-bottom: 1rem;">
        <i class="fa-solid fa-robot me-2" style="color: #2563EB;"></i> Gợi ý sân theo nhu cầu
      </h5>
      <div class="d-flex gap-2 flex-wrap flex-md-nowrap">
        <input type="text" id="aiPrompt" class="au-input" placeholder="Bạn muốn tìm sân như thế nào? (VD: Cho mình tìm sân VIP để đánh giải...)" style="flex: 1;" />
        <button onclick="askAIToSuggest()" class="btn-au-primary" id="btnAI">
          <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Gợi ý sân phù hợp
        </button>
      </div>
      <div id="aiResponseMsg" style="margin-top: 1rem; font-size: 0.9rem; color: #047857; font-weight: 700; display: none; padding: 0.75rem; background: #D1FAE5; border-radius: 8px;">
      </div>
    </div>
    <div class="row g-4" id="customerCourtsList">
      <div class="col-12 text-center" style="color:var(--gray-400); padding: 3rem;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; margin-bottom:1rem; display:block;"></i>
        Đang tải dữ liệu sân từ hệ thống...
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js?v=2.8.0"></script>
  <script>
    const API = '/api';

    (async () => {
      try {
        const response = await fetch(`${API}/auth/me`, {cache: 'no-store'});
        const data = await response.json();
        if (!response.ok || !data.success) {sessionStorage.removeItem('au_user'); return;}
        sessionStorage.setItem('au_user', JSON.stringify(data.user));
        const avatarEl = document.querySelector('.au-avatar');
        if (avatarEl) if (!data.user.avatar_image) avatarEl.textContent = (data.user.fullname || 'K')[0].toUpperCase();
      } catch (_) {}
    })();

    async function loadAllCourts() {
      try {
        const res = await fetch(`${API}/courts`);
        const data = await res.json();
        if (data.success) {
          renderCourtsList(data.data);
        }
      } catch (err) {
        document.getElementById('customerCourtsList').innerHTML = '<div class="col-12 text-center text-danger">Lỗi tải dữ liệu.</div>';
      }
    }

    function renderCourtsList(courtsArray) {
      const container = document.getElementById('customerCourtsList');
      if(!container) return;

      if(courtsArray.length === 0) {
          container.innerHTML = '<div class="col-12 text-center text-muted">Không có sân nào phù hợp.</div>';
          return;
      }

      container.innerHTML = courtsArray.map(c => {
        const isVip = c.court_type && c.court_type.toUpperCase().includes('VIP');
        const badge = isVip ? '<span class="badge-au badge-vip">⭐ Yonex VIP</span>' : '<span class="badge-au badge-standard">Standard</span>';
        const imgStr = isVip ? 'assets/img/court_vip.png' : 'assets/img/court_standard.png';
        const price = Number(c.price_per_hour || 100000).toLocaleString('vi-VN');

        return `
          <div class="col-md-6 col-lg-3">
            <div class="court-card">
              <img src="${imgStr}" alt="${escHtml(c.name)}" class="court-img" onerror="this.src='https://placehold.co/600x400/f3f4f6/a1a1aa?text=Court'"/>
              <div class="court-body">
                <h3 class="court-title">${escHtml(c.name)}</h3>
                <div style="margin-bottom:0.5rem;">${badge}</div>
                <div class="court-price">${price}đ <span style="font-size:0.9rem;color:var(--gray-400);font-weight:500;">/ giờ</span></div>
                
                <div style="margin-top:auto;">
                  <a href="court-detail.html?id=${c.court_id}" class="btn-au-primary w-100 text-center" style="display:block; padding:0.75rem;">Đặt Sân Ngay</a>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function askAIToSuggest() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      if (!prompt) {
        alert("Vui lòng nhập nhu cầu để hệ thống lọc sân phù hợp.");
        return;
      }

      const btn = document.getElementById('btnAI');
      const msgBox = document.getElementById('aiResponseMsg');
      
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Đang suy nghĩ...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/courts/suggest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await res.json();

        if (data.success) {
          msgBox.style.display = 'block';
          msgBox.innerHTML = `<i class="fa-solid fa-check-circle me-1"></i> ${data.ai_message}`;
          renderCourtsList(data.data); 
        } else {
          alert('Không thể gợi ý sân: ' + data.message);
        }
      } catch (error) {
        alert('Không thể kết nối đến dịch vụ gợi ý sân.');
      }

      btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i> Gợi ý sân phù hợp';
      btn.disabled = false;
    }

    loadAllCourts();
  </script>

<script src="assets/js/site-ui.js?v=2.8.0" defer></script>
</body>
</html>
