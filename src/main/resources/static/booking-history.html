<!DOCTYPE html>
<html lang="vi">

<head>
<script>

if (["5500", "5501"].includes(location.port)) {
  const pageName = location.pathname.split("/").pop() || "index.html";
  const adminPage = location.pathname.toLowerCase().includes("/admin/");
  const targetPath = (adminPage ? "/admin/" : "/") + pageName;
  location.replace("http://127.0.0.1:8080" + targetPath + location.search + location.hash);
}
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Sử Đặt Sân — AU Badminton</title>
  <link href="assets/css/bootstrap.min.css?v=2.8.0" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/fontawesome.min.css?v=2.8.0" />
  <link rel="stylesheet" href="assets/css/style.css?v=2.8.0" />
  <style>
    body { background: var(--gray-50); }

    /* ANIMS */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-fadeup { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }

    .stat-box {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-align: center;
      background: white;
      transition: all 0.3s ease;
    }
    .stat-box:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-sm);
      border-color: var(--primary);
    }
    .stat-num { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 0.25rem; }
    .stat-lbl { font-size: 0.75rem; color: var(--gray-400); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }

    .history-card {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: white;
      margin-bottom: 1rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      flex-wrap: wrap;
    }
    .history-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(59,130,246,0.06);
      transform: translateX(4px);
    }

    .date-block { background: var(--gray-50); border-radius: var(--radius-md); padding: 0.75rem; text-align: center; min-width: 80px; border: 1px solid var(--gray-100); }
    .date-day { font-size: 1.8rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 2px; }
    .date-month { font-size: 0.8rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; }
    .date-year { font-size: 0.7rem; color: var(--gray-400); }

    .badge-stt { padding: 0.4em 0.8em; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .stt-pending { background: #FEF3C7; color: #B45309; }
    .stt-confirmed { background: #DCFCE7; color: #15803D; }
    .stt-cancelled { background: #FEE2E2; color: #B91C1C; }

    .btn-action { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--gray-200); background: white; color: var(--gray-600); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: var(--gray-100); transform: scale(1.05); }
    .btn-action.cancel:hover { background: #FEE2E2; color: #B91C1C; border-color: #FCA5A5; }

    .tab-btn { background: none; border: none; padding: 0.5rem 1rem; font-weight: 600; color: var(--gray-500); border-bottom: 2px solid transparent; transition: 0.2s; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  </style>
<script>

function escHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}
</script>
<script>document.documentElement.dataset.theme = localStorage.getItem("au_theme") === "dark" ? "dark" : "light";</script>
</head>

<body>
  <nav class="au-navbar navbar navbar-expand-lg">
    <div class="container">
      <a href="index.html" class="au-logo">
        <div class="au-logo-icon">🏸</div>
        <div>
          <div class="au-logo-text">AU Badminton</div>
          <div class="au-logo-sub">SÂN CẦU LÔNG — UY TÍN #1</div>
        </div>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="d-flex align-items-center gap-3 mx-auto mt-2 mt-lg-0">
          <a href="index.html" class="au-nav-link">Trang Chủ</a>
          <a href="courts.html" class="au-nav-link">Danh Sách Sân</a>
          <a href="booking-history.html" class="au-nav-link active">Lịch Đặt Sân</a>
        </div>
        <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0">
          <a href="#" id="navAvatar" class="au-avatar" style="text-decoration:none;" title="Tài khoản">K</a>
        </div>
      </div>
    </div>
  </nav>

  <div style="background: white; border-bottom: 1px solid var(--gray-200); padding: 2rem 0 0;" class="anim-fadeup">
    <div class="container">
      <div style="font-size:0.85rem;color:var(--gray-400);margin-bottom:0.5rem;">
        <a href="index.html" style="color:inherit;text-decoration:none;">Trang Chủ</a> <i class="fa-solid fa-chevron-right mx-1" style="font-size:0.6rem;"></i> <span style="color:var(--primary);font-weight:600;">Lịch Đặt Của Tôi</span>
      </div>
      <h2 style="font-weight: 800; color: var(--gray-900);">Lịch Sử Đặt Sân</h2>
      <p style="color: var(--gray-500); margin-bottom: 2rem;">Quản lý tất cả các lịch đặt sân của bạn tại AU Badminton.</p>

      <div class="row g-3 mb-4">
        <div class="col"><div class="stat-box"><div class="stat-num" id="statTotal" style="color:var(--gray-800);">0</div><div class="stat-lbl">Tổng Lịch Đặt</div></div></div>
        <div class="col"><div class="stat-box"><div class="stat-num" id="statConfirmed" style="color:var(--primary);">0</div><div class="stat-lbl">Đã Xác Nhận</div></div></div>
        <div class="col"><div class="stat-box"><div class="stat-num" id="statPending" style="color:#B45309;">0</div><div class="stat-lbl">Chờ Xử Lý</div></div></div>
        <div class="col"><div class="stat-box"><div class="stat-num" id="statCancelled" style="color:#B91C1C;">0</div><div class="stat-lbl">Đã Hủy</div></div></div>
        <div class="col"><div class="stat-box"><div class="stat-num" id="statHours" style="color:var(--gray-800);">0h</div><div class="stat-lbl">Tổng Giờ Chơi</div></div></div>
      </div>

      <div class="d-flex border-bottom" id="tabContainer">
        <button class="tab-btn active" onclick="setTab('all')">Tất Cả (<span id="tabCountAll">0</span>)</button>
        <button class="tab-btn" onclick="setTab('confirmed')">Xác Nhận (<span id="tabCountConf">0</span>)</button>
        <button class="tab-btn" onclick="setTab('pending')">Chờ Duyệt (<span id="tabCountPend">0</span>)</button>
        <button class="tab-btn" onclick="setTab('cancelled')">Đã Hủy (<span id="tabCountCanc">0</span>)</button>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top: 2rem; padding-bottom: 5rem;">
    <div id="bookingList">
      <div class="text-center py-5" style="color:var(--gray-400);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;margin-bottom:1rem;display:block;"></i>Đang tải dữ liệu...
      </div>
    </div>
    <div class="text-center mt-4"><a href="courts.html" class="btn-au-primary"><i class="fa-solid fa-calendar-plus me-2"></i> Đặt Thêm Sân Mới</a></div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js?v=2.8.0"></script>
  <script>
    const API = '/api';
    let myBookings = [];
    let currentTab = 'all';

    function calculateHours(start, end) {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      return ((eh * 60 + em) - (sh * 60 + sm)) / 60;
    }

    async function loadMyHistory() {
      let user;
      try {
        const response = await fetch(`${API}/auth/me`, {cache: 'no-store'});
        const data = await response.json();
        if (!response.ok || !data.success) {
          sessionStorage.removeItem('au_user');
          alert('⚠️ Vui lòng đăng nhập để xem lịch sử đặt sân!');
          location.replace('login.html?next=%2Fbooking-history.html'); return;
        }
        user = data.user;
        sessionStorage.setItem('au_user', JSON.stringify(user));
      } catch (_) {
        document.getElementById('bookingList').textContent = 'Không thể kiểm tra tài khoản. Vui lòng thử lại.';
        return;
      }
      if (user.role !== 'user') {
        alert('⚠️ Đây là lịch sử khách hàng. Admin vui lòng xem trong mục Quản lý đặt sân.');
        location.replace('admin/bookings.html'); return;
      }

      const avatarEl = document.getElementById('navAvatar');
      if (avatarEl) {
        if (!user.avatar_image) avatarEl.textContent = (user.fullname || 'U')[0].toUpperCase();
        avatarEl.title = `Tài khoản: ${user.fullname}`;
      }

      try {
        const res = await fetch(`${API}/bookings`); const data = await res.json();
        if (data.success) {
          myBookings = data.data;
          updateDashboardStats(); renderList();
        }
      } catch (err) {
        document.getElementById('bookingList').innerHTML = '<div class="text-center text-danger py-5"><i class="fa-solid fa-triangle-exclamation fa-2x mb-3"></i><br>Lỗi kết nối máy chủ.</div>';
      }
    }

    function updateDashboardStats() {
      let conf = 0, pend = 0, canc = 0, totalHours = 0;
      myBookings.forEach(b => {
        if (b.status === 'CONFIRMED') { conf++; totalHours += calculateHours(b.start_time, b.end_time); }
        else if (b.status === 'PENDING') pend++; else if (b.status === 'CANCELLED') canc++;
      });
      document.getElementById('statTotal').textContent = myBookings.length;
      document.getElementById('statConfirmed').textContent = conf;
      document.getElementById('statPending').textContent = pend;
      document.getElementById('statCancelled').textContent = canc;
      document.getElementById('statHours').textContent = totalHours.toFixed(1) + 'h';
      document.getElementById('tabCountAll').textContent = myBookings.length;
      document.getElementById('tabCountConf').textContent = conf;
      document.getElementById('tabCountPend').textContent = pend;
      document.getElementById('tabCountCanc').textContent = canc;
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[{all:0,confirmed:1,pending:2,cancelled:3}[tab]].classList.add('active'); renderList();
    }

    function renderList() {
      const listDiv = document.getElementById('bookingList');
      let filtered = currentTab !== 'all' ? myBookings.filter(b => b.status.toLowerCase() === currentTab) : myBookings;

      if (filtered.length === 0) {
        listDiv.innerHTML = `<div class="text-center py-5" style="color:var(--gray-400); background:white; border-radius:var(--radius-lg); border:1px dashed var(--gray-300);"><i class="fa-regular fa-calendar-xmark fa-3x mb-3"></i><br>Không có lịch đặt sân nào ở mục này.</div>`;
        return;
      }

      listDiv.innerHTML = filtered.map((b, index) => {
        const dObj = new Date(b.date);
        const day = String(dObj.getDate()).padStart(2, '0');
        const month = 'Th' + (dObj.getMonth() + 1);
        const year = dObj.getFullYear();
        const total = Number(b.grand_total || b.court_amount || 0).toLocaleString('vi-VN');

        let statusBadge = b.status === 'CONFIRMED' ? `<span class="badge-stt stt-confirmed"><i class="fa-solid fa-check"></i> XÁC NHẬN</span>` : (b.status === 'PENDING' ? `<span class="badge-stt stt-pending"><i class="fa-solid fa-hourglass-half"></i> CHỜ DUYỆT</span>` : `<span class="badge-stt stt-cancelled"><i class="fa-solid fa-ban"></i> ĐÃ HỦY</span>`);
        let cancelBtn = (b.status === 'CONFIRMED' || b.status === 'PENDING') ? `<button class="btn-action cancel" onclick="cancelMyBooking(${b.booking_id})" title="Hủy lịch"><i class="fa-solid fa-xmark"></i></button>` : '';

        return `<div class="history-card anim-fadeup" style="animation-delay: ${index * 0.08}s">
            <div class="date-block">
              <div class="date-day">${day}</div><div class="date-month">${month}</div><div class="date-year">${year}</div>
            </div>
            <div style="flex:1;">
              <div style="font-size:0.75rem;font-family:monospace;color:var(--gray-400);font-weight:700;">#BK-${String(b.booking_id).padStart(5, '0')}</div>
              <h4 style="font-size:1.1rem;font-weight:800;color:var(--gray-900);margin:0.25rem 0;">${escHtml(b.court_name)}</h4>
              <div style="display:flex;gap:1rem;font-size:0.8rem;color:var(--gray-500);font-weight:600;flex-wrap:wrap;">
                <span><i class="fa-regular fa-clock me-1"></i> ${b.start_time.substring(0,5)} – ${b.end_time.substring(0,5)}</span>
                <span><i class="fa-solid fa-wallet me-1"></i> QR / Thẻ</span>
              </div>
            </div>
            <div style="text-align:right; min-width: 120px;">
              <div style="font-size:0.7rem;color:var(--gray-400);text-transform:uppercase;font-weight:700;">Tổng tiền</div>
              <div style="font-size:1.2rem;font-weight:800;color:var(--gray-900);">${total}đ</div>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">${statusBadge}${cancelBtn}</div>
          </div>`;
      }).join('');
    }

    async function cancelMyBooking(id) {
      if (!confirm('Bạn có chắc chắn muốn hủy lịch đặt sân này không?')) return;
      try {
        const res = await fetch(`${API}/bookings/${id}/status`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'CANCELLED' }) });
        const data = await res.json(); if (res.ok && data.success) { alert('✅ Đã hủy lịch thành công!'); loadMyHistory(); } else { alert('❌ ' + (data.message || 'Không thể hủy lịch')); }
      } catch (err) { alert('❌ Lỗi kết nối máy chủ.'); }
    }

    loadMyHistory();
  </script>

<script src="assets/js/site-ui.js?v=2.8.0" defer></script>
</body>
</html>
